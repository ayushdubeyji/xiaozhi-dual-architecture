# ==============================================================================
# Dual-Xiaozhi Inter-Agent Federation Nginx Configuration
# Target: Lubuntu i3 Workbench Master Hub (192.168.0.111)
# Exposes /ws/xiaozhi-peer securely to the local LAN (192.168.0.0/24)
# ==============================================================================

# Upstream connection to local Xiaozhi FastAPI / MCP server
upstream xiaozhi_federation_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket map for connection header upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.0.111 workbench.local;

    # --------------------------------------------------------------------------
    # Security: Restrict Federation Endpoints to Local Subnet Only
    # --------------------------------------------------------------------------
    location /ws/xiaozhi-peer {
        # Access Control List (ACL)
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/24;       # Local Pi 4B (192.168.0.106) & LAN nodes
        deny all;

        # WebSocket Reverse Proxy
        proxy_pass http://xiaozhi_federation_backend/ws/xiaozhi-peer;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket Timeouts (Keep persistent federation sessions alive)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 10s;

        # Disable buffering for real-time audio / JSON-RPC streaming
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
    }

    # --------------------------------------------------------------------------
    # REST API for Memory Sync & Dialogue Querying
    # --------------------------------------------------------------------------
    location /api/federation/ {
        allow 127.0.0.1;
        allow ::1;
        allow 192.168.0.0/24;
        deny all;

        proxy_pass http://xiaozhi_federation_backend/api/federation/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Health Check Endpoint
    location /health {
        proxy_pass http://xiaozhi_federation_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
